<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Life - 健康产品</title>
    <style>
        body {
            margin: 0;
            font-family: "Arial", sans-serif;
            background: #f6f9f7;
            color: #333;
        }

        /* Header */
        header {
            background: #4CAF50;
            padding: 1rem;
            text-align: center;
            color: white;
            font-size: 1.2rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            font-weight: bold;
        }

        /* Hero */
        .hero {
            background: url("https://images.unsplash.com/photo-1556228724-4b1dcb5d5f7c") center/cover;
            padding: 6rem 1rem;
            color: white;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

        /* Section */
        .section {
            width: 90%;
            max-width: 1000px;
            margin: 3rem auto;
            text-align: center;
        }

        .section-title {
            margin-bottom: 1.5rem;
            font-size: 2rem;
            color: #2d7c35;
        }

        /* Products */
        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .product-card {
            background: white;
            padding: 1rem;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            border-radius: 6px;
        }

        .product-card h3 {
            margin: 0.8rem 0;
            font-size: 1.2rem;
            color: #2d7c35;
        }

        .product-card p {
            font-size: 0.9rem;
            color: #555;
        }

        /* Footer */
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }

        @media(max-width: 768px) {
            .products {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <a href="#home">首页</a>
            <a href="#about">品牌介绍</a>
            <a href="#products">产品</a>
            <a href="#contact">联系</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <h1>健康，从今天开始</h1>
        <p>天然、安全、科学，让身体恢复本来的力量。</p>
        <a href="#products" class="btn">查看产品</a>
    </section>

    <!-- About Section -->
    <section class="section" id="about">
        <h2 class="section-title">关于我们的品牌</h2>
        <p>
            我们致力于提供高品质、科学验证的健康营养产品。  
            所有产品均采用天然原料并经过严格检测，只为帮助您提升生活质量。
        </p>
    </section>

    <!-- Products Section -->
    <section class="section" id="products">
        <h2 class="section-title">热销健康产品</h2>

        <div class="products">

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1600180758895-74b33bed2d8c" alt="维生素">
                <h3>每日维生素复合片</h3>
                <p>补充关键维生素，提升免疫力与身体活力。</p>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1599058917212-d750089bc07d" alt="益生菌">
                <h3>活性益生菌粉</h3>
                <p>改善肠道健康，促进消化与吸收。</p>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1608338052237-627e1050c0f0" alt="Omega 3">
                <h3>深海鱼油 Omega-3</h3>
                <p>保护心血管系统，提高专注力。</p>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer id="contact">
        <p>© 2025 健康生活 Healthy Life | 联系：support@healthylife.com</p>
    </footer>

</body>
</html>
